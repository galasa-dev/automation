# ARCHIVED SNIPPET - this is NOT a runnable workflow.
#
# These jobs were removed from .github/workflows/build-automation.yaml and
# .github/workflows/pr-build-automation.yaml when the Tekton pull-request build
# flow was retired. They built the images used by that flow:
#   - ghverify   (source: archived/build-images/github-verify)
#   - ghstatus   (source: archived/build-images/github-status)
#   - ghreceiver (source: archived/build-images/github-webhook-receiver)
#
# The Dockerfiles are in archived/dockerfiles/common/.
# Nothing else listed these jobs in a `needs:` list.

#------------------------------------------------------------------------------
# From: .github/workflows/build-automation.yaml  (push to main; images are pushed)
#------------------------------------------------------------------------------
jobs:
  build-ghverify-image:
    name: Build the 'ghverify' image
    runs-on: ubuntu-latest
    needs: check-required-secrets-configured

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dockerfiles/common
            build-images
            offline-tools/copyrighter

      - name: Setup up Go
        uses: actions/setup-go@v5
        with: 
          go-version: 1.22

      - name: Go build 'ghverify'
        working-directory: build-images/github-verify
        run: |
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=amd64
          export GO111MODULE=auto
          go build -o bin/ghverify cmd/main.go

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/ghverify

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        env: 
          WRITE_GITHUB_PACKAGES_USERNAME: ${{ vars.WRITE_GITHUB_PACKAGES_USERNAME }}
          WRITE_GITHUB_PACKAGES_TOKEN: ${{ secrets.WRITE_GITHUB_PACKAGES_TOKEN }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.WRITE_GITHUB_PACKAGES_USERNAME }}
          password: ${{ env.WRITE_GITHUB_PACKAGES_TOKEN }}

      - name: Build and push 'ghverify' Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: build-images/github-verify
          file: dockerfiles/common/ghverify.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-ghstatus-image:
    name: Build the 'ghstatus' image
    runs-on: ubuntu-latest
    needs: check-required-secrets-configured

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
