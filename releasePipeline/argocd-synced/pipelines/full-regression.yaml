apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: full-regression
  namespace: galasa-build
spec:
#
#
#
  params:
  - name: distBranch
    type: string
  - name: version
    type: string
  - name: bootVersion
    type: string
#
#
#
  tasks:
#
#
#
# This pipeline runs DockerLocalJava17Ubuntu and JMeterManagerIVT
# 
# 
# 
  - name: runs-prepare-docker
    taskRef: 
      name: galasactl
    params:
    - name: context
      value: $(context.pipelineRun.name)
    - name: galasaHome
      value: /workspace/git/$(context.pipelineRun.name)
    - name: command
      value: 
        - runs
        - prepare
        - --bootstrap
        - https://prod1-galasa-dev.cicsk8s.hursley.ibm.com/api/bootstrap
        - --portfolio
        - /galasa/tests.yaml
        - --stream
        - inttests
        - --test
        - local.DockerLocalJava17Ubuntu
        - --log # Otherwise there is no output
        - "-"
# 
# 
# 
  - name: runs-prepare-jmeter
    taskRef: 
      name: galasactl
    runAfter:
    - runs-prepare-docker
    params:
    - name: context
      value: $(context.pipelineRun.name)
    - name: galasaHome
      value: /workspace/git/$(context.pipelineRun.name)
    - name: command
      value: 
        - runs
        - prepare
        - --bootstrap
        - https://prod1-galasa-dev.cicsk8s.hursley.ibm.com/api/bootstrap
        - --portfolio
        - /galasa/tests.yaml
        - --append
        - --stream
        - ivts
        - --test
        - jmeter.JMeterManagerIVT
        # Override the default engine property in CPS for this test.
        - --override
        - docker.default.engines=PRIMARY
        - --log # Otherwise there is no output
        - "-"
# 
# 
# 

  - name: runs-submit
    taskRef: 
      name: galasactl
    runAfter:
    - runs-prepare-jmeter
    params:
    - name: context
      value: $(context.pipelineRun.name)
    - name: galasaHome
      value: /workspace/git/$(context.pipelineRun.name)
    - name: command
      value: 
        - runs
        - submit
        - --bootstrap
        - https://prod1-galasa-dev.cicsk8s.hursley.ibm.com/api/bootstrap
        - --portfolio
        - /galasa/tests.yaml
        - --throttle
        - '10'
        - --poll
        - '10'
        - --progress
        - '1'
        - --reportyaml
        - tests.yaml
        - --override
        - galasaecosystem.runtime.repository=https://development.galasa.dev/$(params.distBranch)/maven-repo/obr
        - --override
        - galasaecosystem.isolated.mvp.zip=https://development.galasa.dev/$(params.distBranch)/maven-repo/mvp/dev/galasa/galasa-isolated-mvp/$(params.version)/galasa-isolated-mvp-$(params.version).zip
        - --override
        - galasaecosystem.isolated.full.zip=https://development.galasa.dev/$(params.distBranch)/maven-repo/isolated/dev/galasa/galasa-isolated/$(params.version)/galasa-isolated-$(params.version).zip
        - --override
        - galasaecosystem.docker.version=$(params.distBranch)
        - --override
        - galasaecosystem.runtime.version=$(params.version)
        - --override
        - galasaecosystem.galasaboot.version=$(params.bootVersion)
        - --log # Otherwise there is no output
        - "-"